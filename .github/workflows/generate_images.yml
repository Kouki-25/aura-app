name: Generate Amazon Store Assets

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Pillow
        run: pip install Pillow

      - name: Generate Store Assets
        run: python generate_assets.py

      - name: Upload Store Assets Artifact
        uses: actions/upload-artifact@v4
        with:
          name: amazon-store-assets
          path: generated_store_assets/

